
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 🎂</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 90%;
            max-width: 650px;
            padding: 50px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .cake {
            font-size: 80px;
            animation: bounce 1.5s infinite;
        }

        h1 {
            font-size: 55px;
            color: white;
            text-shadow: 0 0 15px #ff4d88;
            margin: 15px 0;
        }

        h2 {
            color: white;
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: white;
            font-size: 19px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        button {
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            background: #ff4081;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255,64,129,0.5);
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            background: #e91e63;
        }

        .balloon {
            position: absolute;
            bottom: -150px;
            font-size: 70px;
            animation: fly 8s linear infinite;
        }

        .b1 { left: 5%; animation-delay: 1s; }
        .b2 { left: 25%; animation-delay: 3s; }
        .b3 { left: 70%; animation-delay: 0s; }
        .b4 { left: 90%; animation-delay: 4s; }

        @keyframes fly {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-120vh);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -20px;
            animation: fall linear forwards;
            z-index: 20;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
            }
        }

        .hidden-message {
            display: none;
            margin-top: 25px;
            font-size: 24px;
            color: white;
            animation: pop 0.5s ease;
        }

        @keyframes pop {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="balloon b1">🎈</div>
    <div class="balloon b2">🎈</div>
    <div class="balloon b3">🎈</div>
    <div class="balloon b4">🎈</div>

    <div class="card">
        <div class="cake">🎂</div>

        <h1>Happy Birthday! 🎉</h1>

        <h2>✨ Wishing You a Wonderful Day ✨</h2>

        <p>
            May your birthday be filled with happiness, laughter,
            beautiful memories and lots of wonderful moments! 💖
        </p>

        <button onclick="celebrate()">🎁 Click for a Surprise</button>

        <div class="hidden-message" id="message">
            🎊 Have an Amazing Birthday! 🥳💖
        </div>
    </div>

    <script>
        function createConfetti() {
            const confetti = document.createElement("div");
            confetti.classList.add("confetti");

            const colors = [
                "#ff4081",
                "#ffd700",
                "#00e5ff",
                "#7cff00",
                "#ffffff",
                "#9c27b0"
            ];

            confetti.style.background =
                colors[Math.floor(Math.random() * colors.length)];

            confetti.style.left = Math.random() * 100 + "vw";

            confetti.style.width =
                Math.random() * 8 + 5 + "px";

            confetti.style.height =
                Math.random() * 12 + 5 + "px";

            confetti.style.animationDuration =
                Math.random() * 3 + 2 + "s";

            document.body.appendChild(confetti);

            setTimeout(() => {
                confetti.remove();
            }, 5000);
        }

        function celebrate() {
            document.getElementById("message").style.display = "block";

            for (let i = 0; i < 150; i++) {
                setTimeout(createConfetti, i * 15);
            }
        }

        // Continuous confetti
        setInterval(createConfetti, 150);
    </script>

</body>
</html>
